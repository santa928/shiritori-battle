<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fffdf4" />
    <meta
      name="description"
      content="ひとつのスマホで交互に遊ぶ、文字を一度ずつ使うしりとり対戦。ことばの意味を調べる辞書も。"
    />
    <title>しりとりバトル | ふたりでことばの対戦</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./web/styles.css?v=20261009-report1" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <a class="wordmark" href="./" aria-label="しりとりバトル ホーム"
          >しりとり<span>バトル</span></a
        >
        <nav aria-label="モード">
          <button type="button" data-mode="battle" class="mode-active" aria-pressed="true">
            対戦</button
          ><button type="button" data-mode="dictionary" aria-pressed="false">辞書</button>
        </nav>
      </header>
      <main data-battle-app data-manifest="__MANIFEST_URL__"></main>
      <div data-dictionary-app data-manifest="__MANIFEST_URL__" hidden>
        <main>
          <section class="intro">
            <p class="eyebrow">ことばの意味、見つけよう。</p>
            <h1>辞書でしらべる</h1>
            <p>読みから、意味と使える理由を確認。</p>
          </section>
          <form aria-label="辞書を検索">
            <label for="reading">読み <span>（ひらがな）</span></label>
            <div class="search-row">
              <input
                id="reading"
                name="reading"
                type="text"
                placeholder="例：かえる"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-describedby="feedback"
              /><button type="submit">しらべる</button>
            </div>
          </form>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
          <div id="results">
            <div class="empty-state">
              <div class="empty-tiles" aria-hidden="true">
                <span>こ</span><span>と</span><span>ば</span>
              </div>
              <p>気になることばを、ひらがなで。<br />同じ読みの意味も、まとめて見られます。</p>
            </div>
          </div>
          <noscript>辞書の検索にはJavaScriptを有効にしてください。</noscript>
        </main>
      </div>
      <footer>
        しりとりバトル <span>ことばを知ると、もっと楽しい。</span>
        <a
          class="problem-report"
          href="https://github.com/santa928/shiritori-battle/issues/new?template=problem-report.yml"
          target="_blank"
          rel="noopener noreferrer"
          aria-describedby="report-notice"
          >問題を報告する（別タブ）</a
        >
        <p id="report-notice">
          GitHubへのログインが必要です。投稿内容は公開されます。<br />
          個人情報は書かないでください。プレイ履歴や端末情報は自動送信しません。
        </p>
      </footer>
    </div>
    <script type="module" src="./web/bootstrap.mjs?v=20261007-gojuon1"></script>
  </body>
</html>
