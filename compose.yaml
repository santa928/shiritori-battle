name: shiritori-battle-dev
services:
  dev:
    image: node:22-bookworm
    network_mode: bridge
    working_dir: /work
    volumes:
      - .:/work
    command: npm run verify
  preview:
    image: node:22-bookworm
    network_mode: bridge
    working_dir: /work
    volumes:
      - .:/work
    environment:
      PREVIEW_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${SHIRITORI_PREVIEW_PORT:-4173}:4173"
    command: npm run preview -- dist/web
